<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>Elementbound Alpha 0.3</title>
<style>
:root{--bg:#090e1b;--p:#151d31;--p2:#1d2944;--line:#35415f;--txt:#f6f8ff;--mut:#aab5d1;--a:#7fc4ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1c2949,#090e1b 45%);color:var(--txt);font:14px system-ui,-apple-system,sans-serif}button{font:inherit;color:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 20px)}.screen{display:none}.screen.on{display:block}.hero{text-align:center;padding:14vh 8px 30px}.logo{font-size:38px;font-weight:950;letter-spacing:2px}.sub{color:var(--mut);margin:8px 0 30px}.primary,.ghost{width:100%;border:1px solid var(--line);border-radius:14px;padding:15px;background:var(--p2);font-weight:800}.primary{background:linear-gradient(135deg,#315c9d,#553b93);border-color:#7696ce}.ghost{margin-top:9px}.title{font-size:26px;font-weight:900;margin:8px 0}.deckgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.deck{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px;min-height:120px}.deck.sel{outline:2px solid var(--a)}.deck b{font-size:17px}.small{font-size:12px;color:var(--mut);margin-top:5px}.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.diff{border:1px solid var(--line);background:var(--p);border-radius:12px;padding:12px 5px}.diff.sel{outline:2px solid var(--a)}.top{position:sticky;top:0;z-index:5;background:#090e1bea;backdrop-filter:blur(10px);padding:7px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.pill{display:inline-block;background:var(--p);border:1px solid var(--line);border-radius:999px;padding:6px 9px}.stats{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.side{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0}.side.active{outline:2px solid var(--a)}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.slot{min-height:105px;border:1px dashed #53617d;border-radius:11px;padding:5px;background:#0c1324}.card{position:relative;border:1px solid #53617d;border-radius:10px;padding:7px;min-height:92px;background:linear-gradient(145deg,#202c49,#141d32)}.card.play{border-color:#8ed1ff}.card b{font-size:12px;display:block;padding-right:22px}.cost{position:absolute;right:5px;top:5px;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;background:#0c1324;font-weight:900}.fire{box-shadow:inset 0 0 0 1px #a65240}.water{box-shadow:inset 0 0 0 1px #3f87aa}.nature{box-shadow:inset 0 0 0 1px #4f915b}.earth{box-shadow:inset 0 0 0 1px #927a57}.lightning{box-shadow:inset 0 0 0 1px #aaa04c}.air{box-shadow:inset 0 0 0 1px #7d9dac}.hand{display:flex;overflow:auto;gap:7px;padding:7px 0 12px}.hand .card{min-width:145px}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.actions button{border:1px solid var(--line);background:var(--p2);border-radius:11px;padding:12px}.actions button:disabled{opacity:.35}.log{height:120px;overflow:auto;background:#060a12;border:1px solid var(--line);border-radius:12px;padding:7px;font:11px ui-monospace,monospace}.win{text-align:center;font-size:20px;font-weight:900;padding:10px}.modalw{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:20}.modalw.hide{display:none}.modal{width:min(420px,100%);background:var(--p);border:1px solid var(--line);border-radius:16px;padding:14px}.modal button{width:100%;margin:4px 0;border:1px solid var(--line);background:var(--p2);border-radius:10px;padding:11px}
</style></head><body><div class="app">
<section id="home" class="screen on"><div class="hero"><div class="logo">ELEMENTBOUND</div><div class="sub">Alpha 0.3 · Choose your element. Shape the field.</div><button class="primary" onclick="go('setup')">PLAY</button><button class="ghost" onclick="showRules()">HOW TO PLAY</button></div></section>
<section id="setup" class="screen"><div class="title">Choose Your Bender</div><div class="small">Your name stays customizable; your deck determines your Prime affinity.</div><div id="decks" class="deckgrid"></div><div class="title" style="font-size:20px;margin-top:18px">Opponent Difficulty</div><div id="diffs" class="diffs"></div><button id="start" class="primary" disabled onclick="startMatch()">START DUEL</button><button class="ghost" onclick="go('home')">BACK</button></section>
<section id="battle" class="screen"><div class="top"><div class="row"><b>ELEMENTBOUND <span class="small">Alpha 0.3 · EB-1.5</span></b><span id="rev" class="pill"></span></div><div class="stats"><span id="turn" class="pill"></span><span id="chain" class="pill"></span><span id="difficulty" class="pill"></span></div></div><div id="winner"></div>
<div id="enemy" class="side"><div class="row"><b id="ename"></b><b id="evit"></b></div><div id="estats" class="stats"></div><div id="eslots" class="slots"></div></div>
<div id="you" class="side"><div class="row"><b id="pname"></b><b id="pvit"></b></div><div id="pstats" class="stats"></div><div id="pslots" class="slots"></div><b>Hand</b><div id="hand" class="hand"></div></div>
<div class="actions"><button id="attack" onclick="attackPick()">Attack</button><button id="end" onclick="endTurn()">End Turn</button><button onclick="go('setup')">Exit</button></div><h3>Event Log</h3><div id="log" class="log"></div></section>
</div><div id="mw" class="modalw hide"><div class="modal"><h3 id="mt"></h3><div id="mb"></div><button onclick="hideModal()">Cancel</button></div></div>
<script>
const E={FIRE:'🔥',WATER:'💧',NATURE:'🌿',EARTH:'🪨',LIGHTNING:'⚡',AIR:'🌪️'};
const INFO={FIRE:['Blazing Fist','Pressure · Burning','Aggressive damage and finishers'],WATER:['Shifting Tide','Control · Soaked','Flow and battlefield manipulation'],NATURE:['Living Path','Growth · Seeded','Healing and scaling boards'],EARTH:['Iron Mountain','Defense · Unsteady','Armor, Guard and attrition'],LIGHTNING:['Flash Circuit','Combo · Charged','Fast Chains and sequencing'],AIR:['Dancing Gale','Tempo · Momentum','Movement and tactical attacks']};
const BASE={FIRE:[['Cinder Adept',1,1,2],['Ember Guard',2,2,3],['Flare Hawk',3,3,3]],WATER:[['Mist Adept',1,1,3],['Tide Warden',2,1,4],['River Serpent',3,2,4]],NATURE:[['Sproutling',1,1,3],['Root Keeper',2,2,4],['Grove Beast',3,2,5]],EARTH:[['Stone Initiate',1,1,3],['Earthen Guard',2,1,5],['Boulder Ram',3,3,5]],LIGHTNING:[['Spark Runner',1,2,2],['Arc Runner',2,2,3],['Volt Lynx',3,4,2]],AIR:[['Breeze Disciple',1,1,3],['Gale Scout',2,2,3],['Sky Raptor',3,3,3]]};
let choice=null,diff=null,G=null,uid=0;
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}
function setup(){let d=document.getElementById('decks');d.innerHTML='';Object.keys(INFO).forEach(k=>{let x=document.createElement('button');x.className='deck';x.innerHTML=`<b>${E[k]} ${INFO[k][0]}</b><div class=small>${INFO[k][1]}</div><div class=small>${INFO[k][2]}</div>`;x.onclick=()=>{choice=k;document.querySelectorAll('.deck').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');ready()};d.appendChild(x)});let q=document.getElementById('diffs');q.innerHTML='';['Easy','Medium','Difficult'].forEach(k=>{let x=document.createElement('button');x.className='diff';x.textContent=k;x.onclick=()=>{diff=k;document.querySelectorAll('.diff').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');ready()};q.appendChild(x)})}
function ready(){document.getElementById('start').disabled=!(choice&&diff)}
function mk(el,n,c,a,h,guard=false){return{id:++uid,el,n,c,a,h,max:h,armor:0,ready:true,sick:false,guard,zone:'DECK'}}
function deck(el){let b=BASE[el],a=[];for(let i=0;i<6;i++){let z=b[i%3];a.push(mk(el,z[0],z[1],z[2],z[3],z[0]==='Earthen Guard'))}for(let i=0;i<7;i++)a.push({id:++uid,el,n:`${INFO[el][0]} Technique`,c:1+(i%3),type:'TECHNIQUE',zone:'DECK'});for(let i=0;i<7;i++){let z=b[(i+1)%3];a.push(mk(el,z[0],z[1],z[2],z[3],z[0]==='Earthen Guard'))}return a}
function shuffle(a){for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function player(name,el){let d=deck(el);shuffle(d);return{name,el,vit:30,maxE:2,e:2,deck:d,hand:[],wake:[],slots:[null,null,null]}}
function draw(p,ex=true){if(!p.deck.length){if(ex){p.vit-=2;add(`${p.name} takes 2 Exhaustion Damage`);winCheck()}return}let c=p.deck.shift();c.zone='HAND';p.hand.push(c)}
function startMatch(){let keys=Object.keys(INFO),opp=keys.filter(x=>x!==choice)[Math.floor(Math.random()*5)];G={rev:0,turn:1,active:0,chain:0,winner:null,p:[player('Your Bender',choice),player(`${diff} ${INFO[opp][0]} Rival`,opp)],logs:[]};G.p.forEach(p=>{for(let i=0;i<4;i++)draw(p,false)});add(`MATCH START · ${INFO[choice][0]} vs ${INFO[opp][0]}`);go('battle');render()}
function add(s){G.logs.push(`T${G.turn} ${s}`)}function bump(s){G.rev++;if(s)add(s);winCheck();render()}
function me(){return G.p[0]}function foe(){return G.p[1]}function current(){return G.p[G.active]}function other(){return G.p[1-G.active]}
function playable(c){return G&&G.active===0&&!G.winner&&c.c<=me().e&&((c.type==='TECHNIQUE')||me().slots.some(x=>!x))}
function play(c){if(!playable(c))return;let p=me();p.e-=c.c;p.hand=p.hand.filter(x=>x.id!==c.id);G.chain++;if(c.type==='TECHNIQUE'){c.zone='WAKE';p.wake.push(c);let t=foe().slots.find(Boolean);if(t){hit(t,2);add(`${c.n} deals 2 to ${t.n}`);death(foe())}else{foe().vit-=2;add(`${c.n} deals 2 to rival Bender`)}}else{let i=p.slots.findIndex(x=>!x);c.zone='FIELD';c.ready=true;c.sick=true;p.slots[i]=c;add(`SUMMON ${c.n} → M${i+1}`)}bump()}
function hit(m,n){let block=Math.min(m.armor,n);m.armor-=block;m.h-=n-block;return n-block}function death(p){p.slots.forEach((m,i)=>{if(m&&m.h<=0){p.slots[i]=null;m.zone='WAKE';p.wake.push(m);add(`${m.n} destroyed`)}})}
function attackPick(){let a=me().slots.filter(x=>x&&x.ready&&!x.sick);if(!a.length)return;modal('Choose attacker',a.map(m=>[`${m.n} · ${m.a} ATK`,()=>targetPick(m)]))}
function targetPick(att){let e=foe(),guards=e.slots.filter(x=>x&&x.guard&&x.ready),targets=guards.length?guards:e.slots.filter(Boolean),b=targets.map(m=>[`Attack ${m.n}`,()=>attack(att,m)]);if(!guards.length)b.push([`Attack Bender · ${e.vit} Vitality`,()=>attack(att,null)]);modal('Choose target',b)}
function attack(att,t){hideModal();att.ready=false;if(t){let d=hit(t,att.a);add(`${att.n} attacks ${t.n} for ${d}`);death(foe())}else{foe().vit-=att.a;add(`${att.n} hits rival Bender for ${att.a}`)}bump()}
function endTurn(){if(!G||G.winner||G.active!==0)return;G.active=1;turnStart();setTimeout(ai,350)}
function turnStart(){let p=current();p.maxE=Math.min(7,2+Math.floor((G.turn-1)));p.e=p.maxE;p.slots.filter(Boolean).forEach(m=>{m.ready=true;m.sick=false});draw(p,true);G.chain=0;bump(`${p.name} turn begins`)}
function ai(){if(G.winner)return;let p=foe(),e=me(),aggr=diff==='Difficult'?3:diff==='Medium'?2:1;for(let tries=0;tries<aggr;tries++){let c=p.hand.find(x=>x.type!=='TECHNIQUE'&&x.c<=p.e&&p.slots.some(s=>!s));if(!c)break;p.e-=c.c;p.hand=p.hand.filter(x=>x.id!==c.id);let i=p.slots.findIndex(x=>!x);c.zone='FIELD';c.sick=true;p.slots[i]=c;add(`Rival summons ${c.n}`)}p.slots.filter(x=>x&&x.ready&&!x.sick).slice(0,aggr).forEach(m=>{m.ready=false;let guards=e.slots.filter(x=>x&&x.guard&&x.ready),t=guards[0]||e.slots.find(Boolean);if(t){let d=hit(t,m.a);add(`Rival ${m.n} attacks ${t.n} for ${d}`);death(e)}else{e.vit-=m.a;add(`Rival ${m.n} hits Bender for ${m.a}`)}});bump();if(!G.winner){G.active=0;G.turn++;turnStart()}}
function winCheck(){if(!G||G.winner)return;G.p.forEach((p,i)=>{if(p.vit<=0){G.winner=G.p[1-i].name;add(`${G.winner} WINS`)}})}
function modal(t,bs){document.getElementById('mt').textContent=t;let b=document.getElementById('mb');b.innerHTML='';bs.forEach(([s,f])=>{let x=document.createElement('button');x.textContent=s;x.onclick=f;b.appendChild(x)});document.getElementById('mw').classList.remove('hide')}function hideModal(){document.getElementById('mw').classList.add('hide')}
function card(c,can=false){return `<div class="card ${c.el.toLowerCase()} ${can?'play':''}" data-id="${c.id}"><span class=cost>${c.c}</span><b>${E[c.el]} ${c.n}</b><div class=small>${c.type==='TECHNIQUE'?'Technique':`${c.a} ATK · ${c.h}/${c.max} HP${c.guard?' · Guard':''}`}</div>${c.sick?'<div class=small>Summoning sickness</div>':''}</div>`}
function slots(id,p){document.getElementById(id).innerHTML=p.slots.map((m,i)=>`<div class=slot>${m?card(m):`<span class=small>M${i+1} · empty</span>`}</div>`).join('')}
function render(){if(!G)return;let p=me(),e=foe();document.getElementById('rev').textContent=`REV ${G.rev}`;document.getElementById('turn').textContent=`Turn ${G.turn} · ${G.active?'RIVAL':'YOU'}`;document.getElementById('chain').textContent=`Chain ${G.chain}`;document.getElementById('difficulty').textContent=diff;document.getElementById('pname').textContent=`${E[p.el]} ${p.name}`;document.getElementById('ename').textContent=`${E[e.el]} ${e.name}`;document.getElementById('pvit').textContent=`❤️ ${p.vit}`;document.getElementById('evit').textContent=`❤️ ${e.vit}`;document.getElementById('pstats').innerHTML=`<span class=pill>Essence ${p.e}/${p.maxE}</span><span class=pill>Deck ${p.deck.length}</span><span class=pill>Wake ${p.wake.length}</span>`;document.getElementById('estats').innerHTML=`<span class=pill>Essence ${e.e}/${e.maxE}</span><span class=pill>Hand ${e.hand.length}</span><span class=pill>Deck ${e.deck.length}</span>`;slots('pslots',p);slots('eslots',e);let h=document.getElementById('hand');h.innerHTML=p.hand.map(c=>card(c,playable(c))).join('');h.querySelectorAll('.play').forEach(x=>x.onclick=()=>play(p.hand.find(c=>c.id==x.dataset.id)));document.getElementById('attack').disabled=G.active||G.winner||!p.slots.some(x=>x&&x.ready&&!x.sick);document.getElementById('end').disabled=G.active||G.winner;document.getElementById('you').classList.toggle('active',G.active===0);document.getElementById('enemy').classList.toggle('active',G.active===1);document.getElementById('winner').innerHTML=G.winner?`<div class=win>🏆 ${G.winner} wins</div>`:'';let l=document.getElementById('log');l.innerHTML=G.logs.map(x=>`<div>${x}</div>`).join('');l.scrollTop=l.scrollHeight}
function showRules(){modal('How to Play',[[`30 Vitality · 3 field slots · Essence grows from 2 to 7`,hideModal],[`Tap PLAY → choose a Prime deck → choose AI difficulty`,hideModal],[`Summon, end the turn, then attack with Ready Manifestations`,hideModal]])}
setup();
</script></body></html>
