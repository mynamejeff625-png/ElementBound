<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Elementbound Alpha 0.2 — EB-1.5</title>
<style>
:root{--bg:#0b1020;--panel:#151d32;--panel2:#1d2944;--text:#f5f7ff;--muted:#aab4d0;--line:#34415f;--accent:#77b7ff}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(#09101d,#10172a);color:var(--text);font:14px system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit} .app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:5;background:#0b1020ee;backdrop-filter:blur(10px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 10px}
.board{display:grid;gap:10px;padding:10px 0}.side{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
.side.active{outline:2px solid var(--accent)} .name{font-weight:800;font-size:16px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin:7px 0}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.slot{min-height:112px;border:1px dashed #53617d;border-radius:12px;padding:5px;background:#0d1425}
.card{border:1px solid #53617d;background:linear-gradient(145deg,#202c49,#141d32);border-radius:11px;padding:7px;min-height:92px;position:relative}
.card.fire{box-shadow:inset 0 0 0 1px #9f4d3a}.card.water{box-shadow:inset 0 0 0 1px #397ba0}.card.nature{box-shadow:inset 0 0 0 1px #4c8a55}.card.earth{box-shadow:inset 0 0 0 1px #8a7352}.card.lightning{box-shadow:inset 0 0 0 1px #999044}.card.air{box-shadow:inset 0 0 0 1px #7997a5}
.card b{display:block;font-size:12px;padding-right:20px}.cost{position:absolute;right:6px;top:5px;background:#111a2c;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-weight:800}
.tiny{font-size:11px;color:var(--muted);margin-top:4px}.ready{color:#9ee7a5}.sick{color:#ffc779}.hand{display:flex;gap:7px;overflow-x:auto;padding:8px 1px 12px;scroll-snap-type:x mandatory}.hand .card{min-width:150px;scroll-snap-align:start}
.hand .card.playable{border-color:#83c6ff;cursor:pointer}.hand .card:not(.playable){opacity:.62}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button,.modal button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:10px}
.actions button:disabled{opacity:.35}.log{height:145px;overflow:auto;background:#070c16;border:1px solid var(--line);border-radius:12px;padding:8px;font:11px ui-monospace,monospace;color:#c9d3ec}
h3{margin:6px 0}.target{outline:2px solid #ffd56a;cursor:pointer}.danger{color:#ff9d9d}.win{font-size:18px;font-weight:900;text-align:center;padding:10px}
.modalWrap{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:20px}.modal{max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}.hidden{display:none}
</style>
</head>
<body><div class="app">
<div class="top">
 <div class="row"><strong>ELEMENTBOUND <span class="tiny">Alpha 0.2 · EB-1.5</span></strong><span id="rev" class="pill">REV 0</span></div>
 <div class="stats"><span id="turn" class="pill"></span><span id="phase" class="pill"></span><span id="chain" class="pill"></span></div>
</div>
<div id="winner"></div>
<div class="board">
 <section id="p2" class="side"><div class="row"><span class="name">Training Rival</span><span id="p2vit"></span></div><div id="p2stats" class="stats"></div><div id="p2slots" class="slots"></div></section>
 <section id="p1" class="side"><div class="row"><span class="name">Your Bender</span><span id="p1vit"></span></div><div id="p1stats" class="stats"></div><div id="p1slots" class="slots"></div>
 <h3>Hand</h3><div id="hand" class="hand"></div></section>
</div>
<div class="actions"><button id="attack">Attack</button><button id="end">End Turn</button><button id="reset">Reset</button></div>
<div class="stats"><span class="pill">🔥 Burning</span><span class="pill">💧 Soaked</span><span class="pill">🌱 Seeded</span><span class="pill">⚡ Charged</span><span class="pill">🌪 Momentum</span></div><h3>Event Log</h3><div id="log" class="log"></div>
</div>
<div id="modalWrap" class="modalWrap hidden"><div class="modal"><h3 id="modalTitle">Choose target</h3><div id="modalBody"></div><button id="cancel">Cancel</button></div></div>
<script>
const ELEMENT={FIRE:"fire",WATER:"water",NATURE:"nature",EARTH:"earth",LIGHTNING:"lightning",AIR:"air"};
const CARDS={
 flame:{id:"FIRE-K01",name:"Flame Initiate",element:"FIRE",type:"MANIFESTATION",cost:1,atk:1,hp:2,text:"First time this damages a Manifestation, apply Burning."},
 advance:{id:"FIRE-K02",name:"Blazing Advance",element:"FIRE",type:"TECHNIQUE",cost:2,text:"Deal 2 to a Burning Manifestation."},
 inferno:{id:"FIRE-K03",name:"Inferno Fist",element:"FIRE",type:"TECHNIQUE",cost:5,text:"Deal 4. +2 if Burning; destroy → 2 to Bender."},
 guard:{id:"EARTH-K01",name:"Earthen Guard",element:"EARTH",type:"MANIFESTATION",cost:2,atk:1,hp:5,guard:true,text:"Guard."},
 fortify:{id:"EARTH-K02",name:"Fortify",element:"EARTH",type:"TECHNIQUE",cost:2,text:"Give a friendly Manifestation 1 Armor."},
 sprout:{id:"NATURE-K01",name:"Sproutling",element:"NATURE",type:"MANIFESTATION",cost:1,atk:1,hp:2,text:"A small persistent body."},
 mend:{id:"NATURE-K02",name:"Verdant Mend",element:"NATURE",type:"TECHNIQUE",cost:2,text:"Heal 2; if Seeded, gain 1 Growth."},
 spark:{id:"LIGHTNING-K01",name:"Static Step",element:"LIGHTNING",type:"TECHNIQUE",cost:1,text:"Flow 1; advances elemental Chain."},
 arc:{id:"LIGHTNING-K02",name:"Arc Runner",element:"LIGHTNING",type:"MANIFESTATION",cost:2,atk:2,hp:3,text:"Efficient sequencing body."},
 cross:{id:"AIR-K01",name:"Crosswind",element:"AIR",type:"TECHNIQUE",cost:2,text:"Move an enemy Manifestation to another open slot."},
 mist:{id:"WATER-K01",name:"Mist Veil",element:"WATER",type:"MANIFESTATION",cost:2,atk:1,hp:4,text:"Stable Water body."}
};
function copy(k){return {...CARDS[k],uid:crypto.randomUUID?.()||Math.random().toString(36),zone:"DECK"}}
function player(name,deckKeys){return {name,vitality:30,maxEssence:2,essence:2,deck:deckKeys.map(copy),hand:[],wake:[],slots:[null,null,null],resonance:0,breakCharges:0}}
let G;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function init(){
 G={revision:0,turn:1,active:0,phase:"MAIN",chain:0,winner:null,log:[]};
 G.players=[
  player("Your Bender",["flame","flame","advance","guard","fortify","sprout","mend","spark","arc","cross","mist","inferno","flame","guard","arc","sprout","advance","fortify","mist","cross"]),
  player("Training Rival",["guard","guard","sprout","mist","arc","flame","fortify","mend","advance","cross","spark","guard","sprout","mist","arc","flame","fortify","advance","cross","inferno"])
 ];
 G.players.forEach(p=>{shuffle(p.deck);for(let i=0;i<4;i++)draw(p,false)});
 log("MATCH START · EB-1.5 · Kernel validation build"); log("P1 starts at 2 Essence and skips first draw."); assertState(); render();
}
function mutate(msg){G.revision++; if(msg)log(msg); assertState(); render()}
function log(s){G.log.push(`T${G.turn} ${s}`)}
function draw(p,damage=true){if(!p.deck.length){if(damage){p.vitality-=2;log(`${p.name} takes 2 Exhaustion Damage`);checkWinner()}return}let c=p.deck.shift();c.zone="HAND";p.hand.push(c)}
function assertState(){
 for(const p of G.players){
  if(!(p.essence>=0&&p.essence<=p.maxEssence&&p.maxEssence<=7))throw Error("Essence invariant");
  if(p.slots.filter(Boolean).length>3)throw Error("Slot invariant");
  for(const m of p.slots.filter(Boolean)){if(m.armor<0||m.armor>3)throw Error("Armor invariant");if(m.growth<0||m.growth>3)throw Error("Growth invariant");}
  const all=[...p.deck,...p.hand,...p.wake,...p.slots.filter(Boolean)]; let ids=all.map(x=>x.uid); if(new Set(ids).size!==ids.length)throw Error("Zone uniqueness invariant");
 }
 if(G.winner && G.players.every(p=>p.vitality>0))throw Error("Winner invariant");
}
function active(){return G.players[G.active]} function enemy(){return G.players[1-G.active]}
function canPlay(c){return !G.winner && G.active===0 && c.cost<=active().essence && (c.type!=="MANIFESTATION"||active().slots.some(x=>!x))}
function payAndStack(c){let p=active(); if(!canPlay(c))return false;p.essence-=c.cost;p.hand=p.hand.filter(x=>x.uid!==c.uid);c.zone="STACK";return true}
function resolveToWake(c){c.zone="WAKE";active().wake.push(c);G.chain++;log(`CHAIN ${G.chain}`)}
function summon(c){if(!payAndStack(c))return;let i=active().slots.findIndex(x=>!x);c.zone="BATTLEFIELD";c.currentHP=c.hp;c.maxHP=c.hp;c.armor=0;c.growth=0;c.ready=true;c.enteredThisTurn=true;c.marks=[];active().slots[i]=c;G.chain++;mutate(`P1 SUMMON ${c.name} → M${i+1}`)}
function damage(m,n){let absorbed=Math.min(m.armor,n);m.armor-=absorbed;n-=absorbed;m.currentHP-=n;return n}
function stateCheck(owner){
 owner.slots.forEach((m,i)=>{if(m&&m.currentHP<=0){owner.slots[i]=null;m.zone="WAKE";owner.wake.push(m);log(`${m.name} DESTROYED → WAKE`)}})
 checkWinner();
}
function checkWinner(){G.players.forEach((p,i)=>{if(p.vitality<=0&&!G.winner){G.winner=G.players[1-i].name;log(`${G.winner} WINS`)}})}
function chooseTarget(c,side,cb){
 const opts=side.slots.map((m,i)=>m?{m,i}:null).filter(Boolean); if(!opts.length){log(`${c.name}: NO LEGAL TARGET`);render();return}
 showModal(`Choose target for ${c.name}`,opts.map(o=>({label:`M${o.i+1} ${o.m.name} · ${o.m.currentHP} HP`,go:()=>cb(o.m,o.i)})));
}
function playTechnique(c){
 if(!canPlay(c))return;
 if(c.id==="EARTH-K02") return chooseTarget(c,active(),(m)=>{hideModal();if(!payAndStack(c))return;m.armor=Math.min(3,m.armor+1);resolveToWake(c);mutate(`P1 FORTIFY ${m.name} · Armor ${m.armor}`)});
 if(c.id==="NATURE-K02") return chooseTarget(c,active(),(m)=>{hideModal();if(!payAndStack(c))return;m.currentHP=Math.min(m.maxHP,m.currentHP+2);if(m.marks.includes("SEEDED")&&m.growth<3){m.growth++;m.maxHP++;m.currentHP++;m.atk++}resolveToWake(c);mutate(`P1 MEND ${m.name}`)});
 if(c.id==="AIR-K01") return chooseTarget(c,enemy(),(m,idx)=>{let open=enemy().slots.map((x,i)=>!x?i:null).filter(x=>x!==null);if(!open.length){hideModal();log("Crosswind: no open enemy slot");render();return}showModal("Move to slot",open.map(i=>({label:`Enemy M${i+1}`,go:()=>{hideModal();if(!payAndStack(c))return;enemy().slots[idx]=null;enemy().slots[i]=m;resolveToWake(c);mutate(`P1 CROSSWIND ${m.name} → M${i+1}`)}}))});
 if(c.id==="LIGHTNING-K01"){if(!payAndStack(c))return; // Flow 1 = inspect/reorder; simple AI leaves top card
  resolveToWake(c);mutate("P1 STATIC STEP · Flow 1");return}
 if(c.id==="FIRE-K02"||c.id==="FIRE-K03") return chooseTarget(c,enemy(),(m)=>{hideModal();if(!payAndStack(c))return;let base=c.id==="FIRE-K03"?4:2;let burning=m.marks.includes("BURNING");let d=base+(c.id==="FIRE-K03"&&burning?2:0);let dealt=damage(m,d);let destroyed=m.currentHP<=0;if(c.id==="FIRE-K03"&&destroyed){enemy().vitality-=2;log("Inferno Fist deals 2 to enemy Bender")}resolveToWake(c);log(`${c.name} deals ${dealt} to ${m.name}`);stateCheck(enemy());mutate()});
 // fallback technique: legal, resolves to Wake
 if(payAndStack(c)){resolveToWake(c);mutate(`P1 PLAY ${c.name}`)}
}
function play(c){c.type==="MANIFESTATION"?summon(c):playTechnique(c)}
function attackMode(){
 let opts=active().slots.map((m,i)=>m&&m.ready&&!m.enteredThisTurn?{m,i}:null).filter(Boolean);if(!opts.length)return;
 showModal("Choose attacker",opts.map(o=>({label:`M${o.i+1} ${o.m.name} · ${o.m.atk} ATK`,go:()=>chooseAttackTarget(o.m)})))
}
function chooseAttackTarget(att){
 let e=enemy(),guards=e.slots.map((m,i)=>m&&m.guard&&m.ready?{m,i}:null).filter(Boolean);
 let targets=e.slots.map((m,i)=>m?{m,i}:null).filter(Boolean);
 let buttons=targets.map(o=>({label:`Attack M${o.i+1} ${o.m.name}`,go:()=>doAttack(att,o.m)}));
 if(!guards.length)buttons.push({label:`Attack Bender · ${e.vitality} Vitality`,go:()=>doAttack(att,null)});
 showModal("Choose attack target",buttons)
}
function doAttack(att,tgt){hideModal();att.ready=false;if(tgt){let d=damage(tgt,att.atk);log(`${att.name} ATTACKS ${tgt.name} for ${d}`);if(att.id==="FIRE-K01"&&!att.didBurn&&d>0){if(!tgt.marks.includes("BURNING"))tgt.marks.push("BURNING");att.didBurn=true;log(`${tgt.name} gains BURNING`)}stateCheck(enemy())}else{enemy().vitality-=att.atk;log(`${att.name} hits BENDER for ${att.atk}`);checkWinner()}mutate()}
function endTurn(){
 if(G.winner)return; G.active=1-G.active;if(G.active===0)G.turn++;
 let p=active();p.maxEssence=Math.min(7,2+Math.floor((G.turn-1)));p.essence=p.maxEssence;p.slots.filter(Boolean).forEach(m=>{m.ready=true;m.enteredThisTurn=false;m.didBurn=false});
 draw(p,true);G.chain=0;mutate(`${p.name} TURN START`);
 if(G.active===1)setTimeout(aiTurn,300)
}
function aiTurn(){
 if(G.winner)return;let p=active(),e=enemy();
 // summon best affordable body
 let body=p.hand.find(c=>c.type==="MANIFESTATION"&&c.cost<=p.essence&&p.slots.some(x=>!x));
 if(body){let i=p.slots.findIndex(x=>!x);p.essence-=body.cost;p.hand=p.hand.filter(x=>x.uid!==body.uid);body.zone="BATTLEFIELD";body.currentHP=body.hp;body.maxHP=body.hp;body.armor=0;body.growth=0;body.ready=true;body.enteredThisTurn=true;body.marks=[];p.slots[i]=body;G.chain++;mutate(`P2 SUMMON ${body.name}`)}
 // attack with all old ready units
 for(const m of p.slots.filter(x=>x&&x.ready&&!x.enteredThisTurn)){let guards=e.slots.filter(x=>x&&x.guard&&x.ready);let tgt=guards[0]||e.slots.find(Boolean);m.ready=false;if(tgt){let d=damage(tgt,m.atk);log(`P2 ${m.name} attacks ${tgt.name} for ${d}`);stateCheck(e)}else{e.vitality-=m.atk;log(`P2 ${m.name} hits BENDER for ${m.atk}`);checkWinner()}}
 mutate("P2 ACTIONS COMPLETE");if(!G.winner)setTimeout(endTurn,250)
}
function showModal(title,buttons){document.querySelector("#modalTitle").textContent=title;let b=document.querySelector("#modalBody");b.innerHTML="";buttons.forEach(x=>{let q=document.createElement("button");q.textContent=x.label;q.style.width="100%";q.style.margin="5px 0";q.onclick=x.go;b.appendChild(q)});document.querySelector("#modalWrap").classList.remove("hidden")}
function hideModal(){document.querySelector("#modalWrap").classList.add("hidden")}
function cardHTML(c,playable=false){let stats=c.type==="MANIFESTATION"?`<div class=tiny>${c.atk} ATK · ${c.currentHP??c.hp}/${c.maxHP??c.hp} HP ${c.armor?`· 🛡${c.armor}`:""} ${c.growth?`· 🌱${c.growth}`:""}</div>${c.marks&&c.marks.length?`<div class=tiny>State: ${c.marks.join(" · ")}</div>`:""}`:"";return `<div class="card ${ELEMENT[c.element]} ${playable?"playable":""}" data-uid="${c.uid}"><span class=cost>${c.cost}</span><b>${c.name}</b><div class=tiny>${c.element} · ${c.type}</div>${stats}<div class=tiny>${c.text||""}</div>${c.enteredThisTurn?`<div class="tiny sick">Summoning sickness</div>`:c.ready===true?`<div class="tiny ready">Ready</div>`:""}</div>`}
function renderSlots(id,p){let el=document.querySelector(id);el.innerHTML=p.slots.map((m,i)=>`<div class=slot>${m?cardHTML(m):`<span class=tiny>M${i+1} · empty</span>`}</div>`).join("")}
function render(){
 let [a,b]=G.players;document.querySelector("#rev").textContent=`REV ${G.revision}`;document.querySelector("#turn").textContent=`Turn ${G.turn} · ${G.active===0?"YOU":"RIVAL"}`;document.querySelector("#phase").textContent=G.phase;document.querySelector("#chain").textContent=`Chain ${G.chain}`;
 document.querySelector("#p1vit").textContent=`❤️ ${a.vitality}`;document.querySelector("#p2vit").textContent=`❤️ ${b.vitality}`;
 document.querySelector("#p1stats").innerHTML=`<span class=pill>Essence ${a.essence}/${a.maxEssence}</span><span class=pill>Deck ${a.deck.length}</span><span class=pill>Wake ${a.wake.length}</span>`;
 document.querySelector("#p2stats").innerHTML=`<span class=pill>Essence ${b.essence}/${b.maxEssence}</span><span class=pill>Hand ${b.hand.length}</span><span class=pill>Deck ${b.deck.length}</span>`;
 document.querySelector("#p1").classList.toggle("active",G.active===0);document.querySelector("#p2").classList.toggle("active",G.active===1);
 renderSlots("#p1slots",a);renderSlots("#p2slots",b);
 let h=document.querySelector("#hand");h.innerHTML=a.hand.map(c=>cardHTML(c,G.active===0&&canPlay(c))).join("");h.querySelectorAll(".playable").forEach(el=>el.onclick=()=>play(a.hand.find(c=>c.uid===el.dataset.uid)));
 document.querySelector("#attack").disabled=G.active!==0||!a.slots.some(m=>m&&m.ready&&!m.enteredThisTurn)||!!G.winner;document.querySelector("#end").disabled=G.active!==0||!!G.winner;
 document.querySelector("#winner").innerHTML=G.winner?`<div class=win>🏆 ${G.winner} wins</div>`:"";
 let lg=document.querySelector("#log");lg.innerHTML=G.log.map(x=>`<div>${x}</div>`).join("");lg.scrollTop=lg.scrollHeight;
}
document.querySelector("#attack").onclick=attackMode;document.querySelector("#end").onclick=endTurn;document.querySelector("#reset").onclick=init;document.querySelector("#cancel").onclick=hideModal;
init();
</script>
</body></html>
