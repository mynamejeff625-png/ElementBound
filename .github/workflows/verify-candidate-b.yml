name: Verify Element Bound
on:
  push:
    branches: [fix/soaked-progress-0.8.54, fix/balance-pass-0.8.55, fix/balance-pass-0.8.56, fix/balance-pass-0.8.57, fix/balance-lab-parity-0.8.58, fix/calibration-harness-0.8.59, fix/balance-pass-0.8.60, feature/round-end-decay-0.8.61, feature/earth-armor-cap-0.8.61, fix/lightning-air-revert-0.8.61, feature/bloom-resonance-gate-0.8.61, feature/crosswind-attack-debuff-0.8.62, refactor/pure-engine-extraction, feature/mp-authoritative-move-validation-0.9.1, test/mp-auth-and-rules-coverage-0.9.2, feature/mp-client-integration-0.9.3, feature/mp-room-matchmaking-0.9.4, feature/mp-anonymous-auth-bootstrap-0.9.5, fix/mp-explicit-connect-trigger-0.9.6, fix/mp-firebase-init-order-0.9.7, fix/firebase-admin-key-base64-0.9.8, fix/mp-input-drag-activate-1.0.0]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check js/version.js
      - run: node --check js/game.js
      - run: node --check lib/gameEngine.js
      - run: node tests/pure-engine-extraction.cjs
      - run: node --check lib/firebaseAdmin.js
      - run: node tests/firebase-admin-key-base64-0.9.8.cjs
      - run: node --check api/submit-move.js
      - run: node tests/mp-authoritative-move-validation-0.9.1.cjs
      - run: node --check js/multiplayerClient.js
      - run: node tests/mp-client-integration-0.9.3.cjs
      - run: node --check lib/cardCatalog.js
      - run: node --check lib/matchFactory.js
      - run: node --check lib/playerView.js
      - run: node --check js/matchmakingClient.js
      - run: node --check api/create-room.js
      - run: node --check api/join-room.js
      - run: node tests/mp-room-matchmaking-0.9.4.cjs
      - run: node --check js/firebaseBootstrap.js
      - run: node --check api/firebase-config.js
      - run: node tests/mp-anonymous-auth-bootstrap-0.9.5.cjs
      - run: npm run test:firestore-rules
      - run: node tests/candidate-b.cjs
      - run: node tests/balance-pass-0.8.55.cjs
      - run: node tests/balance-pass-0.8.56.cjs
      - run: node tests/balance-lab-magma-parity.cjs
      - run: node tests/balance-pass-0.8.57.cjs
      - run: node tests/balance-lab-parity-0.8.58.cjs
      - run: node tests/calibration-harness-0.8.59.cjs
      - run: node tests/balance-pass-0.8.60.cjs
      - run: node tests/round-end-decay-0.8.61.cjs
      - run: node tests/earth-armor-cap-0.8.61.cjs
      - run: node tests/lightning-air-revert-0.8.61.cjs
      - run: node tests/bloom-resonance-gate-0.8.61.cjs
      - run: node tests/crosswind-attack-debuff-0.8.62.cjs
