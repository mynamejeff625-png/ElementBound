name: Verify Element Bound
on:
  push:
    branches: [fix/soaked-progress-0.8.54, fix/balance-pass-0.8.55, fix/balance-pass-0.8.56, fix/balance-pass-0.8.57, fix/balance-lab-parity-0.8.58, fix/calibration-harness-0.8.59, fix/balance-pass-0.8.60, feature/round-end-decay-0.8.61, feature/earth-armor-cap-0.8.61, fix/lightning-air-revert-0.8.61, feature/bloom-resonance-gate-0.8.61, feature/crosswind-attack-debuff-0.8.62, refactor/pure-engine-extraction, feature/mp-authoritative-move-validation-0.9.1, test/mp-auth-and-rules-coverage-0.9.2, feature/mp-client-integration-0.9.3, feature/mp-room-matchmaking-0.9.4, feature/mp-anonymous-auth-bootstrap-0.9.5, fix/mp-explicit-connect-trigger-0.9.6, fix/mp-firebase-init-order-0.9.7, fix/firebase-admin-key-base64-0.9.8, fix/mp-input-drag-activate-1.0.0, feature/mp-event-stream-1.0.1, hotfix/mp-event-stream-fixes, feature/mp-response-window-1.1.0, hotfix/mp-technique-target-and-response-polish, feature/mp-visual-parity-1.1.1, fix/version-sync-1.1.2]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check js/version.js
      - run: node --check js/hostRedirect.js
      - run: node tests/host-redirect-1.1.2.cjs
      - run: node --check js/ui.js
      - run: node --check js/mainMenu.js
      - run: node --check tests/main-menu-1.5.0.cjs
      - run: node tests/main-menu-1.5.0.cjs
      - run: node --check tests/menu-transitions-1.5.1.cjs
      - run: node tests/menu-transitions-1.5.1.cjs
      - run: node --check js/tomeData.js
      - run: node --check js/tomeLessons.js
      - run: node --check js/tome.js
      - run: node --check tests/tome-1.7.0.cjs
      - run: node tests/tome-1.7.0.cjs
      - run: node --check js/trials.js
      - run: node --check tests/trials-map-1.6.0.cjs
