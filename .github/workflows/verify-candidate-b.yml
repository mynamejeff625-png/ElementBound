name: Verify Candidate B
on:
  push:
    branches: [fix/soaked-progress-0.8.54]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check js/game.js
      - run: node tests/candidate-b.cjs
